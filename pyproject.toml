[project]
name = "logimouse"
version = "0.2.0"
description = "Query Logitech HID++ devices (name, firmware, battery, DPI) on a Logi Bolt receiver or connected directly"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
logimouse = "logimouse:main"
logi = "logimouse:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
