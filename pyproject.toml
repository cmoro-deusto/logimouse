[project]
name = "logimouse"
version = "0.1.0"
description = "Query Logitech HID++ devices (name, firmware, battery) through a Logi Bolt receiver"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
logimouse = "logimouse:main"
logi = "logimouse:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
